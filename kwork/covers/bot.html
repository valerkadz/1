<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}body{width:660px;height:440px;font-family:"DejaVu Sans",Arial,sans-serif;background:linear-gradient(135deg,#1c8ad6,#2aa7e8 55%,#56c3f0);color:#fff;position:relative;overflow:hidden}
.c{position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
h1{position:absolute;left:40px;top:50px;font-size:38px;line-height:1.1;font-weight:800;width:360px}
ul{padding:0;position:absolute;left:40px;top:210px;list-style:none;font-size:20px;line-height:1.75}
li:before{content:"✓ ";color:#b8ffcf;font-weight:700}
.tag{position:absolute;left:40px;bottom:34px;background:#fff;color:#1c8ad6;font-weight:800;font-size:20px;padding:10px 18px;border-radius:30px}
.ph{position:absolute;right:46px;top:46px;width:200px;height:350px;background:#fff;border-radius:28px;box-shadow:0 20px 40px rgba(0,0,0,.25);padding:46px 14px 14px}
.ph:before{content:"";position:absolute;top:16px;left:70px;width:60px;height:8px;border-radius:4px;background:#dde3ea}
.m{font-size:12px;padding:8px 10px;border-radius:12px;margin-bottom:8px;max-width:90%;color:#222;background:#eef3f8}
.r{margin-left:auto;background:#d6f4c9}
.b{display:block;text-align:center;font-size:12px;font-weight:700;color:#1c8ad6;border:2px solid #1c8ad6;border-radius:10px;padding:6px;margin-bottom:6px}
</style></head><body>
<div class="c" style="width:300px;height:300px;left:-90px;top:-120px"></div><div class="c" style="width:220px;height:220px;left:300px;top:300px"></div>

<div class="ph"><div class="m">Здравствуйте! Чем помочь?</div><div class="m r">Записаться</div><div class="m">Выберите время:</div><span class="b">Сегодня 15:00</span><span class="b">Завтра 11:00</span><div class="m r">Завтра 11:00</div><div class="m">✅ Вы записаны!</div></div>
</body></html>
